<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy 17th Birthday!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0d0d1a;
      color: #fff;
    }

    /* Background Photos Container */
    .bg-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      z-index: 1;
      opacity: 0.45;
      filter: brightness(0.85) contrast(1.1);
    }

    .bg-half {
      flex: 1;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Set background images to local image files */
    .bg-left {
      background-image: url('image.png');
    }

    .bg-right {
      background-image: url('Copia de image.png');
    }

    /* Subtle Overlay Grid */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.75) 100%);
      z-index: 2;
      pointer-events: none;
    }

    /* Canvas for physics & particles */
    #fxCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 3;
      pointer-events: none;
    }

    /* Main UI Layer */
    .ui-layer {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 3rem;
      text-shadow: 0 0 15px rgba(255, 105, 180, 0.8), 0 0 25px rgba(0, 0, 0, 0.9);
      margin-bottom: 30px;
      transition: all 0.5s ease;
      background: linear-gradient(45deg, #ff71ce, #01cdfe, #05ffa1, #b967ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      max-width: 900px;
      line-height: 1.2;
    }

    .main-btn {
      padding: 22px 50px;
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      background: linear-gradient(135deg, #ff007f, #7928ca);
      border: 4px solid #ffffff;
      border-radius: 60px;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(255, 0, 127, 0.8), 0 10px 20px rgba(0,0,0,0.5);
      transition: transform 0.2s, box-shadow 0.2s;
      outline: none;
      animation: pulse 1.8s infinite alternate;
    }

    .main-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 50px rgba(255, 0, 127, 1), 0 15px 30px rgba(0,0,0,0.6);
    }

    .main-btn:active {
      transform: scale(0.95);
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 25px rgba(255,0,127,0.7); }
      100% { transform: scale(1.06); box-shadow: 0 0 45px rgba(255,0,127,1), 0 0 25px rgba(1,205,254,0.8); }
    }

    /* Orbiting Spinning Cake Container */
    #cakeOrbit {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      z-index: 5;
      display: none;
      pointer-events: none;
    }

    /* LARGER SPINNING CAKE */
    .spinning-cake {
      position: absolute;
      width: 260px;
      height: 260px;
      margin-left: -130px;
      margin-top: -130px;
      font-size: 200px;
      line-height: 260px;
      text-align: center;
      filter: drop-shadow(0 0 30px rgba(255, 215, 0, 1)) drop-shadow(0 0 50px rgba(255, 0, 127, 0.8));
      will-change: transform;
    }
  </style>
</head>
<body>

  <!-- Background Photos -->
  <div class="bg-container">
    <div class="bg-half bg-left"></div>
    <div class="bg-half bg-right"></div>
  </div>

  <div class="overlay"></div>

  <!-- Particle & Bouncing Physics Canvas -->
  <canvas id="fxCanvas"></canvas>

  <!-- UI Content -->
  <div class="ui-layer">
    <h1 id="titleText">Click the BUTTON BELOW</h1>
    <button class="main-btn" id="clickBtn" onclick="startCelebration()">CLICK ME</button>
  </div>

  <!-- Spinning Orbiting Cake -->
  <div id="cakeOrbit">
    <div class="spinning-cake" id="cakeElement">🎂</div>
  </div>

  <script>
    const canvas = document.getElementById('fxCanvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    let isCelebrating = false;
    let orbitAngle = 0;
    let selfSpinAngle = 0;
    let orbitRadius = Math.min(width, height) * 0.35;

    // Bouncing 17 Elements physics objects
    const bouncingNumbers = [];
    const confettiParticles = [];

    class Bouncing17 {
      constructor() {
        this.size = 65;
        this.x = Math.random() * (width - this.size * 2) + this.size;
        this.y = Math.random() * (height - this.size * 2) + this.size;
        this.vx = (Math.random() - 0.5) * 12;
        this.vy = (Math.random() - 0.5) * 12;
        if (Math.abs(this.vx) < 3) this.vx = 5;
        if (Math.abs(this.vy) < 3) this.vy = -5;
        this.color = `hsl(${Math.random() * 360}, 100%, 65%)`;
        this.rotation = 0;
        this.vRot = (Math.random() - 0.5) * 0.1;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.rotation += this.vRot;

        // Bounce off walls
        if (this.x - this.size / 2 <= 0 || this.x + this.size / 2 >= width) {
          this.vx *= -1;
          this.color = `hsl(${Math.random() * 360}, 100%, 65%)`;
        }
        if (this.y - this.size / 2 <= 0 || this.y + this.size / 2 >= height) {
          this.vy *= -1;
          this.color = `hsl(${Math.random() * 360}, 100%, 65%)`;
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        // Circular background badge
        ctx.beginPath();
        ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 20;
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        // Text '17'
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 32px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('17', 0, 2);

        ctx.restore();
      }
    }

    class Particle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 16;
        this.vy = (Math.random() - 0.5) * 16 - 3;
        this.size = Math.random() * 10 + 5;
        this.color = `hsl(${Math.random() * 360}, 100%, 60%)`;
        this.alpha = 1;
        this.decay = Math.random() * 0.015 + 0.005;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.2; // Gravity
        this.alpha -= this.decay;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function createConfettiBurst(x, y, count = 80) {
      for (let i = 0; i < count; i++) {
        confettiParticles.push(new Particle(x, y));
      }
    }

    function playBirthdayMelody() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const audio = new AudioCtx();

        const notes = [
          { f: 264, d: 0.35 }, { f: 264, d: 0.25 }, { f: 297, d: 0.5 }, { f: 264, d: 0.5 }, { f: 352, d: 0.5 }, { f: 330, d: 0.9 },
          { f: 264, d: 0.35 }, { f: 264, d: 0.25 }, { f: 297, d: 0.5 }, { f: 264, d: 0.5 }, { f: 396, d: 0.5 }, { f: 352, d: 0.9 }
        ];

        let now = audio.currentTime + 0.1;

        notes.forEach((note) => {
          const osc = audio.createOscillator();
          const gain = audio.createGain();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(note.f, now);

          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + note.d - 0.05);

          osc.connect(gain);
          gain.connect(audio.destination);

          osc.start(now);
          osc.stop(now + note.d);

          now += note.d;
        });
      } catch (e) {
        console.log("Audio not supported or blocked.");
      }
    }

    function startCelebration() {
      if (isCelebrating) return;
      isCelebrating = true;

      // Update Header Text
      document.getElementById('titleText').innerText = "Happy birthday to my favorite little fat fucker!";

      // Hide Button
      document.getElementById('clickBtn').style.display = 'none';

      // Show Cake Orbit
      document.getElementById('cakeOrbit').style.display = 'block';

      // Create 12 bouncing "17" badges
      for (let i = 0; i < 12; i++) {
        bouncingNumbers.push(new Bouncing17());
      }

      // Initial Burst of Confetti
      createConfettiBurst(width / 2, height / 2, 120);

      // Play Sound
      playBirthdayMelody();
    }

    // Animation Loop
    function animate() {
      ctx.clearRect(0, 0, width, height);

      if (isCelebrating) {
        // Orbit Cake around center and spin on its own axis smoothly
        orbitAngle += 0.02;
        selfSpinAngle += 3; // Self spinning speed
        
        orbitRadius = Math.min(width, height) * 0.35;
        const offsetX = Math.cos(orbitAngle) * orbitRadius;
        const offsetY = Math.sin(orbitAngle) * orbitRadius;
        
        const cakeContainer = document.getElementById('cakeElement');
        if (cakeContainer) {
          cakeContainer.style.transform = `translate(${offsetX}px, ${offsetY}px) rotate(${selfSpinAngle}deg)`;
        }

        // Random secondary bursts of confetti
        if (Math.random() < 0.05) {
          createConfettiBurst(Math.random() * width, Math.random() * height * 0.7, 25);
        }

        // Draw and update bouncing 17s
        bouncingNumbers.forEach(num => {
          num.update();
          num.draw();
        });

        // Draw and update confetti particles
        for (let i = confettiParticles.length - 1; i >= 0; i--) {
          const p = confettiParticles[i];
          p.update();
          p.draw();
          if (p.alpha <= 0) {
            confettiParticles.splice(i, 1);
          }
        }
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
